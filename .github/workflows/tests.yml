name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Библиотеки чтения форматов
        run: python -m pip install -r requirements.txt
      - name: Тесты (Linux: под виртуальным дисплеем)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk8.6
          xvfb-run -a python selftest.py -v
      - name: Тесты (Windows)
        if: runner.os == 'Windows'
        run: python selftest.py -v
